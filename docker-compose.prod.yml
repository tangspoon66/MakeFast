version: '3.8'

services:
  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - nginx
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    expose:
      - "80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - frontend
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    expose:
      - "8000"
    volumes:
      - libraries:/opt/libraries
      - firmware_data:/opt/firmware
      - template_data:/opt/templates
      - app_data:/app/data
    environment:
      - ENV=production
      - COOKIE_SECURE=true
      - PYTHONUNBUFFERED=1
      - HOST=0.0.0.0
      - PORT=8000
      - APP_DATA_PATH=/app/data
      - FIRMWARE_STORAGE_PATH=/opt/firmware
      - TEMPLATE_STORAGE_PATH=/opt/templates
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - ADMIN_USERNAME=${ADMIN_USERNAME}
      - ADMIN_PASSWORD_HASH=${ADMIN_PASSWORD_HASH}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_API_BASE=${OPENAI_API_BASE}
      - AI_MODEL=${AI_MODEL}
      - TENCENT_ASR_ENABLED=${TENCENT_ASR_ENABLED}
      - TENCENT_ASR_SECRET_ID=${TENCENT_ASR_SECRET_ID}
      - TENCENT_ASR_SECRET_KEY=${TENCENT_ASR_SECRET_KEY}
      - TENCENT_ASR_APP_ID=${TENCENT_ASR_APP_ID}
      - TENCENT_ASR_REGION=${TENCENT_ASR_REGION}
      - TENCENT_ASR_ENGINE_MODEL_TYPE=${TENCENT_ASR_ENGINE_MODEL_TYPE}
      - REDIS_URL=redis://redis:6379/0
      - OPS_DB_PATH=/app/data/ops.sqlite3
      - COMPILE_CONCURRENCY=${COMPILE_CONCURRENCY:-1}
      - COMPILE_QUEUE_TIMEOUT_SECONDS=${COMPILE_QUEUE_TIMEOUT_SECONDS:-2}
      - OBJECT_STORAGE_ENABLED=${OBJECT_STORAGE_ENABLED:-false}
      - OBJECT_STORAGE_BUCKET=${OBJECT_STORAGE_BUCKET}
      - OBJECT_STORAGE_ENDPOINT=${OBJECT_STORAGE_ENDPOINT}
      - OBJECT_STORAGE_REGION=${OBJECT_STORAGE_REGION:-auto}
      - OBJECT_STORAGE_ACCESS_KEY_ID=${OBJECT_STORAGE_ACCESS_KEY_ID}
      - OBJECT_STORAGE_SECRET_ACCESS_KEY=${OBJECT_STORAGE_SECRET_ACCESS_KEY}
      - OBJECT_STORAGE_PUBLIC_BASE_URL=${OBJECT_STORAGE_PUBLIC_BASE_URL}
      - OBJECT_STORAGE_PREFIX=${OBJECT_STORAGE_PREFIX:-makefast}
      - ARDUINO_DATA_DIR=/opt/libraries/arduino15
      - ARDUINO_LIBRARIES_DIR=/opt/libraries/arduino
    command: sh -c "python3 /app/scripts/ensure_toolchain.py && uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 1"
    restart: unless-stopped
    depends_on:
      - redis
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    expose:
      - "80"
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes --maxmemory 128mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    restart: unless-stopped

volumes:
  libraries:
    external: true
    name: esp-online_libraries
  firmware_data:
    external: true
    name: esp-online_firmware_data
  template_data:
    external: true
    name: esp-online_template_data
  app_data:
    external: true
    name: esp-online_app_data
  redis_data:
    external: true
    name: esp-online_redis_data
  caddy_data:
    external: true
    name: esp-online_caddy_data
  caddy_config:
    external: true
    name: esp-online_caddy_config
