version: '3.8'

# Development compose file. For Linux production deployment use:
# docker compose -f docker-compose.prod.yml up -d

services:
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      # - "443:443"  # HTTPS (取消注释以启用，需配合 SSL 证书)
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # - ./ssl:/etc/nginx/ssl:ro  # SSL 证书目录 (取消注释以启用)
    depends_on:
      - backend
      - frontend
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    expose:
      - "8000"
    volumes:
      - ./backend:/app
      - libraries:/opt/libraries
      - firmware_data:/opt/firmware
      - template_data:/opt/templates
    environment:
      - PYTHONUNBUFFERED=1
      - HOST=0.0.0.0
      - PORT=8000
      - FIRMWARE_STORAGE_PATH=/opt/firmware
      - TEMPLATE_STORAGE_PATH=/opt/templates
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - VITE_API_BASE_URL=http://localhost
    command: npm run dev -- --host

volumes:
  libraries:
  firmware_data:
  template_data:
